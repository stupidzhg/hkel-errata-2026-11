<text x="56" y="178" font-size="20" font-weight="bold" fill="#555555">Current text</text>
<text x="56.0" y="210" font-size="23" fill="#1a1a1a">(5) The minimum bow height for a ship shall be derived from formula 1 in the case of a ship of less</text>
<text x="56.0" y="246" font-size="23" fill="#1a1a1a">than 250 metres in length (L) and from formula 2 in the case of a ship of </text>
<rect x="818.8" y="228" width="221.2" height="28" fill="#fbe9e7"/>
<text x="819.8" y="246" font-size="23" fill="#b22222" font-weight="bold">250 metres of more</text>
<text x="1039.0" y="246" font-size="23" fill="#1a1a1a"> in</text>
<text x="56.0" y="282" font-size="23" fill="#1a1a1a">length (L)— [...]</text>
<text x="56" y="342" font-size="20" font-weight="bold" fill="#555555">Counterpart — Traditional Chinese</text>
<text x="56.0" y="374" font-size="23" fill="#1a1a1a">(5)如屬長度(L)小於250米的船舶，則其最小船首高度須透過公式1求得，如屬長度(L)</text>
<text x="56.0" y="410" font-size="23" fill="#1a1a1a">為</text>
<rect x="78.0" y="392" width="134.7" height="28" fill="#e6f4ea"/>
<text x="79.0" y="410" font-size="23" fill="#137333" font-weight="bold">250米或以上</text>
<text x="211.7" y="410" font-size="23" fill="#1a1a1a">的船舶，則須透過公式2求得 —— [...]</text>
<text x="56" y="470" font-size="20" font-weight="bold" fill="#555555">Suggested correction</text>
<text x="56.0" y="502" font-size="23" fill="#14532d">Replace “250 metres of more” with “250 metres or more”.</text>
