<text x="56" y="178" font-size="20" font-weight="bold" fill="#555555">Current text</text>
<text x="56.0" y="210" font-size="23" fill="#1a1a1a">《原有紀律處分規例</text>
<rect x="262.0" y="192" width="456.3" height="28" fill="#fbe9e7"/>
<text x="263.0" y="210" font-size="23" fill="#b22222" font-weight="bold">》pre-amended Disciplinary Regulation)</text>
<text x="56.0" y="246" font-size="23" fill="#1a1a1a">指在緊接生效日期之前有效的《醫生(註冊及紀律處分程序)規例》(第161章，附屬法例E)；</text>
<text x="56" y="306" font-size="20" font-weight="bold" fill="#555555">Counterpart — English</text>
<text x="56.0" y="338" font-size="23" fill="#1a1a1a">pre-amended Disciplinary Regulation (《原有紀律處分規例》) means the Medical Practitioners</text>
<text x="56.0" y="374" font-size="23" fill="#1a1a1a">(Registration and Disciplinary Procedure) Regulation (Cap. 161 sub. leg. E) as in force</text>
<text x="56.0" y="410" font-size="23" fill="#1a1a1a">immediately before the commencement;</text>
<text x="56" y="470" font-size="20" font-weight="bold" fill="#555555">Suggested correction</text>
<text x="56.0" y="502" font-size="23" fill="#14532d">“《原有紀律處分規例》(pre-amended Disciplinary Regulation)</text>
<text x="56.0" y="538" font-size="23" fill="#14532d">指在緊接生效日期之前有效的《醫生(註冊及紀律處分程序)規例》(第161章，附屬法例E)；” — insert</text>
<text x="56.0" y="574" font-size="23" fill="#14532d">the missing opening “(” before “pre-amended”.</text>
