<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="656" viewBox="0 0 1160 656" font-family="'Noto Sans CJK HK','Noto Sans CJK TC','Noto Sans CJK SC',sans-serif">
<rect width="1160" height="656" fill="white"/>
<text x="56" y="84" font-size="32" font-weight="bold" fill="#1a1a1a">P2-02 · Cap. 123I, s. 7A(1)(c)</text>
<text x="56" y="121" font-size="19" fill="#555555">Numbering typo (TC) · TC · Temporal_ID: s7A_1_c</text>
<line x1="56" y1="134" x2="1104" y2="134" stroke="#bbbbbb" stroke-width="2"/>
<text x="56" y="178" font-size="20" font-weight="bold" fill="#555555">Current text</text>
<text x="56.0" y="210" font-size="23" fill="#1a1a1a">(c)為 ——(i)男性而設的盥洗盆的數目，須不少於表19第1部所指明的數目；及</text>
<rect x="832.8" y="192" width="26.4" height="28" fill="#fbe9e7"/>
<text x="833.8" y="210" font-size="23" fill="#b22222" font-weight="bold">(i)</text>
<rect x="55.0" y="228" width="48.0" height="28" fill="#fbe9e7"/>
<text x="56.0" y="246" font-size="23" fill="#b22222" font-weight="bold">女性</text>
<text x="102.0" y="246" font-size="23" fill="#1a1a1a">而設的盥洗盆的數目，須不少於表19第2部所指明的數目。</text>
<text x="56" y="306" font-size="20" font-weight="bold" fill="#555555">Counterpart — English</text>
<text x="56.0" y="338" font-size="23" fill="#1a1a1a">(c) the number of lavatory basins provided for— (i) male persons must be not less than the</text>
<text x="56.0" y="374" font-size="23" fill="#1a1a1a">number specified in Part 1 of Table 19; and</text>
<rect x="511.1" y="356" width="116.9" height="28" fill="#e6f4ea"/>
<text x="512.1" y="374" font-size="23" fill="#137333" font-weight="bold">(ii) female</text>
<text x="626.9" y="374" font-size="23" fill="#1a1a1a"> persons must be not less than the number</text>
<text x="56.0" y="410" font-size="23" fill="#1a1a1a">specified in Part 2 of Table 19.</text>
<text x="56" y="470" font-size="20" font-weight="bold" fill="#555555">Suggested correction</text>
<text x="56.0" y="502" font-size="23" fill="#14532d">Second subparagraph: “(ii)女性而設的盥洗盆的數目，須不少於表19第2部所指明的數目。”</text>
<line x1="56" y1="540" x2="1104" y2="540" stroke="#bbbbbb" stroke-width="1"/>
