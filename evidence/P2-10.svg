<text x="107.2" y="210" font-size="23" fill="#b22222" font-weight="bold">(Mainland))</text>
<text x="238.6" y="210" font-size="23" fill="#1a1a1a">指中國的任何部分，但不包括香港、澳門及台灣；</text>
<text x="56" y="270" font-size="20" font-weight="bold" fill="#555555">Counterpart — English</text>
<text x="56.0" y="302" font-size="23" fill="#1a1a1a">Mainland (內地) means any part of China other than Hong Kong, Macao and Taiwan.</text>
<text x="56" y="362" font-size="20" font-weight="bold" fill="#555555">Suggested correction</text>
<text x="56.0" y="394" font-size="23" fill="#14532d">“內地 (Mainland)指中國的任何部分，但不包括香港、澳門及台灣；” — delete the extra “)”.</text>
