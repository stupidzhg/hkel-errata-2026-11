<text x="56" y="84" font-size="32" font-weight="bold" fill="#1a1a1a">P2-13 · Cap. 136, s. 70(2)</text>
<text x="56" y="121" font-size="19" fill="#555555">Unbalanced parenthesis (EN) · EN · Temporal_ID: s70_2</text>
<line x1="56" y1="134" x2="1104" y2="134" stroke="#bbbbbb" stroke-width="2"/>
<text x="56" y="178" font-size="20" font-weight="bold" fill="#555555">Current text</text>
<text x="56.0" y="210" font-size="23" fill="#1a1a1a">(2) No prosecution under this section shall be instituted except by or with the consent of the</text>
<text x="56.0" y="246" font-size="23" fill="#1a1a1a">Secretary for Justice. </text>
<rect x="286.1" y="228" width="320.3" height="28" fill="#fbe9e7"/>
<text x="287.1" y="246" font-size="23" fill="#b22222" font-weight="bold">(Amended L.N. 362 of 1997))</text>
<text x="56" y="306" font-size="20" font-weight="bold" fill="#555555">Counterpart — Traditional Chinese</text>
<text x="56.0" y="338" font-size="23" fill="#1a1a1a">(2)除非由律政司司長提出或經律政司司長同意，否則不得根據本條提出檢控。</text>
<text x="56" y="398" font-size="20" font-weight="bold" fill="#555555">Suggested correction</text>
<text x="56.0" y="430" font-size="23" fill="#14532d">“…Secretary for Justice. (Amended L.N. 362 of 1997)” — delete the extra “)” after the</text>
<text x="56.0" y="466" font-size="23" fill="#14532d">amendment note.</text>
